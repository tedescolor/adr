[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-distributional-regression"
version = "0.1.0"
description = "Conditional density estimation through agent-written programs (ADR)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.scripts]
adr = "adr.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2610.37611"
Replication = "https://github.com/tedescolor/ADR_replication"

[tool.setuptools]
packages = ["adr"]
